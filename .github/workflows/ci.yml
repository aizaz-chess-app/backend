name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are wasted work, but every push to dev/main should complete.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # prisma7.config.ts reads DATABASE_URL for the datasource; `prisma generate` never connects, but the value must be present.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

jobs:
  checks:
    name: Lint, typecheck & OpenAPI spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - run: pnpm lint:check
      - run: pnpm format:check
      - run: pnpm typecheck

      # Runs `nest build` first, so this covers the production build as well as the committed spec.
      - run: pnpm openapi:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - run: pnpm test

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - run: pnpm test:e2e

  # The only check the branch rulesets require, so adding or renaming a job above means editing `needs` and nothing else.
  ci:
    name: CI
    needs: [checks, test, e2e]
    # Without this the job is skipped when a dependency fails, and a skipped required check does not block the merge.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | jq -e 'any(.[]; .result != "success")' > /dev/null; then
            echo '::error::One or more jobs did not succeed.'
            exit 1
          fi
