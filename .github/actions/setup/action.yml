name: Setup
description: Install pnpm and Node, then install dependencies from the lockfile.

runs:
  using: composite
  steps:
    # No version input: the action reads the pinned pnpm from package.json's `packageManager`.
    - uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    # postinstall runs `prisma generate`; src/generated is gitignored, so nothing compiles until this step.
    - run: pnpm install --frozen-lockfile
      shell: bash
